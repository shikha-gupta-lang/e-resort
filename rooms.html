<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css');
body,html {
  overflow: visible;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background: linear-gradient(135deg, #fdf0f0, #f3d9dc);

}
.resort-header {
  color: white;
  overflow: visible;
}
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0, 0, 0, 0.6);
  padding: 15px 30px;
  flex-wrap: wrap;
}
.logo {
  font-size: 28px;
  font-weight: bold;
  background-color: #264b73;
  padding: 10px 20px;
  border-radius: 4px;
}
.logo .highlight {
  color: #e91e63;
}
.contact {
  font-size: 16px;
  color: white;
}
.popup-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.5);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}
.popup-form {
  background: white;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
  width: 300px;
  text-align: center;
}
.popup-form input{
  width: 100%;
  margin: 10px 0;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
}
.popup-form button{
  background-color: #e91e63;
  color: white;
  font-weight: bold;
  border: none;
  height: 30px;
  width: 30%;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.3s ease;
}
.popup-form button:hover {
  background-color: #c2185b;
}
.popup-close {
  position: absolute;
  top: 10px;
  right: 20px;
  font-size: 18px;
  cursor: pointer;
}
.social-icons {
  display: flex;
  gap: 10px;
  font-size: 16px;
  color: white;
}
.main-nav {
  position: sticky;
  top: 0;
  z-index: 9999;
  background-color: #e91e63;
  text-align: center;
  padding: 10px 0;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}
.main-nav ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
}
.main-nav li {
  margin: 0 15px;
}
.main-nav a {
  color: white;
  text-decoration: none;
  font-weight: bold;
  font-size: 15px;
  transition: color 0.3s;
}
.main-nav a:hover {
  color: #915d6d;
}
.cart {
  font-size: 15px;
  cursor: pointer;
}
.hero-image{
  position: relative;
  background-image: url(/image/istockphoto-1300757575-612x612.jpg);
  height: 420px;
  background-size: cover;
  background-position: center;
}
.dropdown {
  position: relative;
  display: inline-block;
}
.dropdown-content {
  display: none;
  position: absolute;
  background-color: rgba(0, 0, 0, 0.9);
  min-width: 160px;
  box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.8);
  z-index: 1;
  text-align: left;
}
.dropdown-content a {
  color: white;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
}
.dropdown-content a:hover {
  background-color: #b30059;
}
.dropdown:hover .dropdown-content {
  display: block;
}
  </style>
</head>
<body>
  <header class="resort-header">
    <div class="top-bar">
      <div class="logo">
        <span>E-<span class="highlight">R</span>ESORT</span>
      </div>
      <div class="contact">
        <i class="fas fa-phone"></i> (789) 1234-567
      </div>
      <div class="top-icons">
        <button onclick="showPopup('login')">Login</button>
        <button onclick="showPopup('register')">Register</button>
      </div>
      <div class="social-icons">
        <i class="fab fa-facebook-f"></i>
        <i class="fab fa-x-twitter"></i>
        <i class="fab fa-instagram"></i>
        <i class="fab fa-linkedin-in"></i>
        <i class="fas fa-envelope"></i>
      </div>
    </div>
  </header>
  <div class="popup-overlay" id="login-popup">
    <div class="popup-form">
      <div class="popup-close" onclick="hidePopup('login')">&times;</div>
      <h4>Login</h4>
      <input type="text" placeholder="Username">
      <input type="password" placeholder="Password">
      <button>Login</button>
    </div>
  </div>

  <div class="popup-overlay" id="register-popup">
    <div class="popup-form">
      <div class="popup-close" onclick="hidePopup('register')">&times;</div>
      <h4>Register</h4>
      <input type="text" placeholder="Username">
      <input type="email" placeholder="Email">
      <input type="password" placeholder="Password">
      <input type="password" placeholder="Confirm Password" id="reg-confirm-password">
      <button onclick="validateRegister()">Register
      </button>
    </div>
  </div>
          <nav class="main-nav">
            <ul>
              <li><a href="index.html">HOME</a></li>
              <li><a href="rooms.html">ROOMS</a></li>
              <li><a href="booking.html">BOOKING</a></li>
              <div class="dropdown">
                <a href="#">RESORT INFO ▼</a>
                <div class="dropdown-content">
                  <a href="#">Room Types</a>
                  <a href="#">Amenities</a>
                  <a href="#">Events</a>
                </div>
              </div>
              <li><a href="contact.html">Contact US</a></li>
              <li class="cart"><i class="fas fa-shopping-bag"></i> 0</li>
            </ul>
          </nav>
        <div class="hero-image">
        </div>
        <script>
          function showPopup(type) {
    const popup = document.getElementById(`${type}-popup`);
    if (popup) popup.style.display = 'flex';
  }
  function hidePopup(type) {
    const popup = document.getElementById(`${type}-popup`);
    if (popup) popup.style.display = 'none';
  }
  document.addEventListener('click', function (e) {
    const loginPopup = document.getElementById('login-popup');
    const registerPopup = document.getElementById('register-popup');
    if (
      loginPopup.style.display === 'flex' &&
      !e.target.closest('.popup-form') &&
      !e.target.closest('[onclick^="showPopup"]')
    ) {
      loginPopup.style.display = 'none';
    }
    if (
      registerPopup.style.display === 'flex' &&
      !e.target.closest('.popup-form') &&
      !e.target.closest('[onclick^="showPopup"]')
    ) {
      registerPopup.style.display = 'none';
    }
  });
  function validateRegister() {
    const password = document.getElementById("reg-password").value;
    const confirmPassword = document.getElementById("reg-confirm-password").value;
  
    if (password !== confirmPassword) {
      alert("Passwords do not match!");
      return false;
    }
  
    alert("Registration successful!");
    hidePopup('register');
    return true;
  }
        </script>
</body>
</html>
